version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: tickstep-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tickstep
      POSTGRES_PASSWORD: tickstep_dev
      POSTGRES_DB: tickstep
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickstep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
